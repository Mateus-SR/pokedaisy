# Builds a debug APK for 32-bit Android devices (armeabi-v7a, plus arm64-v8a so one APK
# installs on both) and attaches it to the run as an artifact. Run it by hand from the
# Actions tab ("Build 32-bit APK" > Run workflow). The APK is signed with the debug key,
# so it is for sideloading on your own device, not a replacement for a release.
name: Build 32-bit APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: NDK + CMake
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Debug APK (armeabi-v7a + arm64-v8a)
        run: ./gradlew :app:assembleDebug -Ppokedaisy.abis=armeabi-v7a,arm64-v8a --stacktrace

      - name: Check the APK carries the 32-bit library
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "${apk}" | grep -E "lib/(armeabi-v7a|arm64-v8a)/libpokedaisy.so"
          unzip -l "${apk}" | grep -q "lib/armeabi-v7a/libpokedaisy.so"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PokeDaisy-armv7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
